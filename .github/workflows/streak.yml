name: Generate Analytics Cards

# Renders every card in the README's GitHub Analytics section to committed SVGs
# under profile/:  streak.svg, streak-light.svg, activity-graph.svg,
# activity-graph-light.svg. All four come from scripts/generate_cards.py, which
# reads GitHub's own GraphQL contribution calendar.
#
# WHY THERE IS NO THIRD-PARTY SERVICE HERE - read before "simplifying" this.
# The activity graph used to be downloaded, pre-rendered, from
# github-readme-activity-graph.vercel.app. On 2026-08-24 that deployment began
# answering 402 DEPLOYMENT_DISABLED - the maintainer's hobby Vercel project was
# switched off. The old job caught the failed download and kept the previous
# file, so it reported success every night while serving a graph frozen for 13
# days. The streak card was generated locally and kept updating, which is why
# only half the section went stale and nobody noticed.
# Two rules came out of that, and both are load-bearing:
#   1. Nothing here may depend on a service someone else has to keep paying for.
#   2. Nothing here may fail quietly. If the data cannot be fetched the job goes
#      red. A stale card that still looks fine is the failure we are avoiding.
#
# SCHEDULING - read before touching the cron lines.
# These cards must track the CURRENT day, so this runs through the day, not
# once at night. The old design rendered in a 01:00-02:59 Berlin window and
# then refused to run again until the next night ("already updated today").
# That made every card a snapshot of the small hours: contributions made
# during the day did not appear until roughly 24 hours later, and a streak
# that was wrong at 01:14 stayed wrong until 01:14 the next morning. On
# 2026-09-12 that is exactly what happened - see the note in the gate below.
#
# GitHub cron is UTC-only and best-effort; round minutes (:00 :15 :30 :45) are
# the most contended and get dropped first. So: a window every three hours,
# two odd-minute attempts in each, and a staleness gate that lets the first
# one that actually lands do the work. Worst-case age of a card is one window.
# DST needs no maintenance because nothing here keys off a wall-clock hour.
on:
  schedule:
    - cron: "7,41 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    # Structural loop guard, independent of anyone reading the comment on the
    # commit step. The card commits only ever touch profile/*.svg, so ignoring
    # that path means a card commit cannot re-trigger this workflow even if a
    # PAT one day reaches the pusher and defeats the GITHUB_TOKEN rule.
    paths-ignore:
      - 'profile/**'

permissions:
  contents: write

concurrency:
  group: analytics-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Live head of main, not the SHA that created the event. Runs are
          # queued rather than cancelled, so one that starts behind another
          # would otherwise gate on pre-commit history, re-render what the first
          # run already committed, and fail on a non-fast-forward push.
          ref: main
          # The gate reads when profile/ last changed, so it needs real history.
          fetch-depth: 0

      - name: Decide whether this run should do the work
        id: gate
        env:
          TZ: Europe/Berlin
          EVENT: ${{ github.event_name }}
          # Must land between the two REAL gaps in the schedule, which are
          # uneven: 34m from :07 to :41, then 146m from :41 to the next :07.
          # Under 34 and both slots in a window duplicate work. At 147+ a commit
          # landing on :41 makes the following :07 hold, the schedule phase-locks
          # onto :41, and the second attempt per window - the entire reason there
          # are two - stops firing. So it is the 146m gap that binds here, not
          # the three-hour window.
          MAX_AGE_MINUTES: "120"
        run: |
          set -euo pipefail

          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT trigger - running unconditionally"
            exit 0
          fi

          # Gate on the AGE of the cards, not on the calendar date they carry.
          # The date test this replaces ("skip if profile/ already changed
          # today") meant the first run after midnight claimed the day and every
          # later slot no-opped, so the cards could never improve on whatever
          # the 01:1x render happened to see. On 2026-09-12 the 01:14 run
          # recorded a broken streak, and the 00:50, 04:24 and 05:37 runs all
          # logged "already updated today - skipping" while the profile served
          # a zero for the rest of the day.
          #
          # An age test has no such absorbing state: if nothing changed, the
          # commit is not made, the age keeps growing and the next slot tries
          # again. The job is ten seconds of API calls, so re-running is far
          # cheaper than being wrong for a day.
          now="$(date '+%Y-%m-%d %H:%M %Z')"
          # `git log` prints nothing (exit 0) when profile/ has no history yet,
          # and `set -u`/`-e` would then blow up on the arithmetic below rather
          # than on anything to do with the cards. Normalise to 0 instead.
          last_epoch="$(git log -1 --format=%ct -- profile/ 2>/dev/null || true)"
          case "$last_epoch" in
            ''|*[!0-9]*) last_epoch=0 ;;
          esac
          if [ "$last_epoch" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::no usable profile/ history - running at $now"
            exit 0
          fi

          age=$(( ( $(date +%s) - last_epoch ) / 60 ))
          # A Berlin date rollover always changes the series and the graph's
          # aria-label, so a commit is guaranteed at least once a day. Past 24h
          # the schedule itself is not landing - the "a lost night becomes a lost
          # week" case the removed rescue cron used to annunciate. That must not
          # arrive looking like an ordinary notice.
          if [ "$age" -ge 1440 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::cards are ${age}m old (>24h) - the schedule is not landing"
          elif [ "$age" -ge "$MAX_AGE_MINUTES" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::cards are ${age}m old (limit ${MAX_AGE_MINUTES}m) - running at $now"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cards are ${age}m old (limit ${MAX_AGE_MINUTES}m) - fresh, holding"
          fi

      - name: Render the cards
        if: steps.gate.outputs.run == 'true'
        env:
          # Berlin is the DISPLAY clock and only the display clock: the date the
          # cards are labelled with, the last day the graph plots, and the date
          # the verify step below greps for. It must not become UTC - during
          # CEST a 23:xx UTC slot is already the next Berlin day, so a UTC-dated
          # card would plot only through yesterday and sit there all day, which
          # is the lag this pipeline exists to remove.
          #
          # It is NOT the clock the streak reasons with, and the two must stay
          # apart. GitHub buckets the contribution calendar in UTC, so
          # generate_cards.py anchors the current streak on the UTC day on
          # purpose. Collapsing them back into one clock is what rendered a live
          # 66-day streak as 0 on 2026-09-12 - see the long comment on the
          # anchor in that file before touching either.
          #
          # Midnight safety no longer comes from running in a quiet window;
          # there is no window any more. It comes from CARD_DAY, pinned once in
          # the run block below and reused by verify. GitHub accepts a `to` past
          # the current UTC instant and returns that day with a zero count, so
          # asking the calendar for Berlin-today is safe.
          TZ: Europe/Berlin
          # STREAK_TOKEN (a PAT with `repo`) makes private contributions count.
          # Falls back to the job token, which sees public activity only.
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the display day once, here, and let verify reuse it. Slots run
          # all day now - in CEST the 21:41 UTC slot is 23:41 Berlin, and this
          # file has seen crons land over three hours late - so render and
          # verify can otherwise straddle Berlin midnight and reject a good card.
          echo "CARD_DAY=$(date +%F)" >> "$GITHUB_ENV"
          CARD_DAY="$(date +%F)" python3 scripts/generate_cards.py

      - name: Verify the cards are actually current
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: Europe/Berlin    # must match the render step - see the note above
        run: |
          set -euo pipefail
          # The graph's aria-label ends on the last day plotted. If that is not
          # today, something rendered stale data and must not be committed.
          today="${CARD_DAY:?CARD_DAY was not set by the render step}"
          for f in profile/activity-graph.svg profile/activity-graph-light.svg; do
            grep -q "and $today" "$f" \
              || { echo "::error::$f does not plot through $today"; exit 1; }
          done
          for f in profile/streak.svg profile/streak-light.svg \
                   profile/activity-graph.svg profile/activity-graph-light.svg; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
            grep -q "</svg>" "$f" || { echo "::error::$f is truncated"; exit 1; }
          done
          echo "all four cards verified current through $today"

      # Do NOT give this step STREAK_TOKEN or any other PAT. It pushes to main,
      # and this workflow also triggers `on: push` to main. That is not a loop
      # only because pushes made with the default GITHUB_TOKEN do not trigger
      # further workflow runs. A PAT is treated as a real user push and would
      # start an endless push -> run -> commit -> push cycle.
      - name: Commit updated cards
        if: steps.gate.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update analytics cards"
          file_pattern: profile/*.svg
