name: Generate Snake Animation

# Builds an animated "snake" that eats your contribution graph and
# commits the SVGs to the `output` branch. Runs around 1 AM and 1 PM IST,
# and on demand. Off the :30 slot and with a retry, because GitHub drops
# scheduled runs on contended minutes - a re-run just republishes the same
# snake, so the retry needs no gate.
on:
  schedule:
    - cron: "37 7,19 * * *"     # 1:07 AM / 1:07 PM IST
    - cron: "47 8,20 * * *"     # retry, 2:17 AM / 2:17 PM IST
  workflow_dispatch:          # manual / on-demand trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=orange&color_dots=#bfd0d8,#70a5fd,#4c8bf5,#3563e9,#1a3fc4

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
