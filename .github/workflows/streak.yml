name: Generate Analytics Cards

# Renders every card in the README's GitHub Analytics section to committed SVGs
# under profile/, all four from scripts/generate_cards.py, which reads GitHub's
# own GraphQL contribution calendar.
#
# WHY THERE IS NO THIRD-PARTY SERVICE HERE - read before "simplifying" this.
# The activity graph used to be downloaded, pre-rendered, from
# github-readme-activity-graph.vercel.app. On 2026-08-24 that deployment began
# answering 402 DEPLOYMENT_DISABLED - the maintainer's hobby Vercel project was
# switched off. The old job caught the failed download and kept the previous
# file, so it reported success every night while serving a graph frozen for 13
# days. The streak card was generated locally and kept updating, which is why
# only half the section went stale and nobody noticed.
# Two rules came out of that, and both are load-bearing:
#   1. Nothing here may depend on a service someone else has to keep paying for.
#   2. Nothing here may fail quietly. If the data cannot be fetched the job goes
#      red. A stale card that still looks fine is the failure we are avoiding.
#
# SCHEDULING NOTE — read before touching the cron lines.
# GitHub cron is UTC-only and runs on a shared best-effort queue. A single daily
# cron is NOT reliable: over Aug 2026 this workflow was scheduled for 03:30 UTC
# and never once started on time (delays of 40min to 3h14m), and on 2026-08-27 the
# run was dropped entirely with no error and no notification. Round-number minutes
# (:00, :15, :30, :45) are the most contended slots on the platform.
#
# So instead of one cron we fire a spread of odd-minute slots and let the gate
# step below decide which one actually does the work:
#   - hour 6 UTC covers 08:00 Berlin in summer (CEST, UTC+2)
#   - hour 7 UTC covers 08:00 Berlin in winter (CET,  UTC+1)
# The gate only proceeds when the LOCAL Berlin hour is 08 and the cards have not
# already been updated today, so DST is handled automatically and we still commit
# at most once a day. The later slots exist purely as retries for dropped runs.
on:
  schedule:
    # Primary: the 08:00 Berlin window, in both seasons.
    - cron: "2,9,17,31,49 6 * * *"    # 08:02-08:49 Berlin while CEST is in effect
    - cron: "2,9,17,31,49 7 * * *"    # 08:02-08:49 Berlin while CET  is in effect
    # Catch-up: if every slot above got dropped, these still rescue the day.
    - cron: "13 8,10,12,14,16,18,20,22 * * *"
  workflow_dispatch:                  # manual / on-demand trigger
  push:
    branches: [ main ]

permissions:
  contents: write

# A push run and a scheduled run can overlap. Queue them instead of letting both
# race to push - and never cancel, or the survivor may be the one that skips.
concurrency:
  group: analytics-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The gate reads when profile/ last changed, so it needs real history.
          fetch-depth: 0

      - name: Decide whether this run should do the work
        id: gate
        env:
          TZ: Europe/Berlin
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Manual runs and pushes are always intentional - never gate them.
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT trigger - running unconditionally"
            exit 0
          fi

          now_local="$(date '+%Y-%m-%d %H:%M %Z')"
          today="$(date +%F)"
          last="$(git log -1 --format=%cd --date=format-local:%F -- profile/ || true)"

          # Already done today - every later slot becomes a no-op. This is what
          # keeps 17 scheduled runs a day down to a single commit.
          if [ "$last" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cards already updated today ($today) - skipping"
            exit 0
          fi

          # Not yet 08:00 Berlin - hold, so the daily refresh lands in the morning
          # rather than at whatever hour the first cron of the day happens to fire.
          if [ "$(date +%H)" \< "08" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$now_local is before the 08:00 window - holding"
            exit 0
          fi

          # Stale and past 08:00: do the work. Any slot from 08:00 to midnight
          # qualifies, so the day is only lost if EVERY run is dropped.
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "::notice::$now_local, cards last updated ${last:-never} - running"

      - name: Render the cards
        if: steps.gate.outputs.run == 'true'
        env:
          # Pin the render to UTC. The gate reasons in Berlin time (that is the
          # schedule the cards are FOR), but the dates printed INTO the cards and
          # the dates the verify step checks must come from one clock or the two
          # disagree for the 1-2h each night when Berlin is already on the next
          # day. Runners happen to be UTC today; stating it keeps that from being
          # load-bearing luck.
          TZ: UTC
          # STREAK_TOKEN (a PAT with `repo`) makes private contributions count.
          # Falls back to the job token, which sees public activity only.
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_cards.py

      - name: Verify the cards are actually current
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: UTC              # must match the render step - see the note above
        run: |
          set -euo pipefail
          # The graph's aria-label ends on the last day plotted. If that is not
          # today, something rendered stale data and must not be committed.
          today="$(date -u +%F)"
          for f in profile/activity-graph.svg profile/activity-graph-light.svg; do
            grep -q "and $today" "$f" \
              || { echo "::error::$f does not plot through $today"; exit 1; }
          done
          for f in profile/streak.svg profile/streak-light.svg \
                   profile/activity-graph.svg profile/activity-graph-light.svg; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
            grep -q "</svg>" "$f" || { echo "::error::$f is truncated"; exit 1; }
          done
          echo "all four cards verified current through $today"

      - name: Commit updated cards
        if: steps.gate.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update analytics cards"
          file_pattern: profile/*.svg
