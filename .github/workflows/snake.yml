name: Generate Snake Animation

# Builds an animated "snake" that eats your contribution graph and
# commits the SVGs to the `output` branch. Runs on a timer, on push,
# and on demand — so it always reflects your latest contributions.
on:
  schedule:
    - cron: "30 19 * * *"    # 1:00 AM IST
    - cron: "30 7 * * *"     # 1:00 PM IST
  workflow_dispatch:          # manual / on-demand trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=orange&color_dots=#bfd0d8,#70a5fd,#4c8bf5,#3563e9,#1a3fc4

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
