name: Generate Streak Stats

# Renders all four README analytics cards (streak.svg, streak-light.svg,
# activity-graph.svg, activity-graph-light.svg) from GitHub's own GraphQL
# contribution calendar - no third-party service that can go down or start
# charging, and no fallback that keeps a stale card. If data cannot be fetched
# the job goes red. The contribution snake is built in the same run.
#
# WHERE THE CARDS LIVE - nothing is pushed, to main or to any other branch.
# They are deployed as a GitHub Pages artifact and the README loads them from
# https://vinay4955.github.io/vinay4955/. A Pages deployment does not update a
# branch, so it never touches the repo's "Updated" time (the last push to ANY branch),
# never lands in the Contributors sidebar or the contribution graph, and main
# carries only the owner's own work. Pages replaces the whole site on every
# deploy, which is why the snake is built into the same dist/.
#
# SCHEDULE - twice a day, 1 AM and 1 PM IST (plus once on any push that
# changes the cards).
# GitHub cron is UTC-only and best-effort: runs start late and are sometimes
# dropped with no error and no failed run. :00 and :30 are the most contended
# minutes. On 2026-09-25 the lone "30 7" (1 PM IST) cron never started, and the
# lone "30 19" one started 3h late. So each target gets seven odd-minute
# attempts across ~4h, and scripts/slot.py lets the first one that lands do the
# work while the retries behind it no-op. IST has no DST, so these never need
# adjusting. 1 AM IST = 19:30 UTC, 1 PM IST = 07:30 UTC.
on:
  schedule:
    - cron: "37 7,19 * * *"
    - cron: "11,47 8,20 * * *"
    - cron: "23,53 9,21 * * *"
    - cron: "29 10,22 * * *"
    - cron: "13 11,23 * * *"
  # A change to the cards themselves republishes at once rather than waiting
  # for the next window. No loop: this workflow never pushes anything.
  push:
    branches: [main]
    paths:
      - '.github/workflows/streak.yml'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

# Two retries landing together must not both publish the same slot.
concurrency:
  group: analytics-cards
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write     # keepalive step below
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch the last published card
        run: |
          bash scripts/fetch_last_card.sh \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/streak.svg" \
            "$RUNNER_TEMP/last-streak.svg"

      - name: Decide whether this slot still needs a run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CARD_FILE: ${{ runner.temp }}/last-streak.svg
        run: python3 scripts/slot.py

      - name: Render the cards
        if: steps.gate.outputs.run == 'true'
        env:
          # Berlin is the display clock (card date, last day plotted); the
          # streak itself is reasoned in UTC inside generate_cards.py. Keep
          # both - collapsing them zeroed a live streak on 2026-09-12.
          TZ: Europe/Berlin
          CARD_OUT: dist
          CARD_SLOT: ${{ steps.gate.outputs.slot }}
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the display day once so render and verify cannot straddle
          # Berlin midnight and disagree about a card that is fine.
          day="$(date +%F)"
          echo "CARD_DAY=$day" >> "$GITHUB_ENV"
          CARD_DAY="$day" python3 scripts/generate_cards.py

      - name: Verify the cards are current
        if: steps.gate.outputs.run == 'true'
        env:
          CARD_OUT: dist
          CARD_SLOT: ${{ steps.gate.outputs.slot }}
        run: bash scripts/verify_cards.sh

      - name: Build the snake
        if: steps.gate.outputs.run == 'true'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=orange&color_dots=#bfd0d8,#70a5fd,#4c8bf5,#3563e9,#1a3fc4

      - name: Upload the Pages artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # GitHub disables scheduled workflows in a public repo after 60 days
      # with no activity, and nothing here commits to main. Enabling an
      # enabled workflow is a no-op that resets that clock - no commit.
      # Runs even when the gate held or a step above failed; if it fails
      # itself the job goes red, so it cannot lapse silently.
      - name: Keep the schedules alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/streak.yml/enable"

  deploy:
    needs: streak
    if: needs.streak.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
