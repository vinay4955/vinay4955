name: Generate Streak Stats

# Renders all four README analytics cards to committed SVGs under profile/:
#   streak.svg, streak-light.svg, activity-graph.svg, activity-graph-light.svg
# All four are generated from scripts/generate_cards.py using GitHub's own
# GraphQL API — no third-party service that can go down or start charging.
# Runs twice a day (1 AM and 1 PM IST) and on demand. No push trigger —
# avoiding the cascade where a card commit re-fires this workflow.
on:
  schedule:
    - cron: "30 19 * * *"    # 1:00 AM IST
    - cron: "30 7 * * *"     # 1:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Render the cards
        env:
          TZ: Europe/Berlin
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "CARD_DAY=$(date +%F)" >> "$GITHUB_ENV"
          CARD_DAY="$(date +%F)" python3 scripts/generate_cards.py

      - name: Verify the cards are current
        env:
          TZ: Europe/Berlin
        run: |
          set -euo pipefail
          today="${CARD_DAY:?CARD_DAY was not set by the render step}"

          for f in profile/streak.svg profile/streak-light.svg \
                   profile/activity-graph.svg profile/activity-graph-light.svg; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
            grep -q "</svg>" "$f" || { echo "::error::$f is truncated"; exit 1; }
            grep -q "<!-- rendered $today -->" "$f" \
              || { echo "::error::$f was not rendered today ($today)"; exit 1; }
          done

          for f in profile/activity-graph.svg profile/activity-graph-light.svg; do
            grep -q "and $today" "$f" \
              || { echo "::error::$f does not plot through $today"; exit 1; }
          done

          for c in streak streak-light activity-graph activity-graph-light; do
            grep -q "profile/$c.svg?d=$today" README.md \
              || { echo "::error::README does not point at today's $c.svg"; exit 1; }
          done

          echo "all four cards verified current through $today"
          echo "README URLs verified at ?d=$today"

      - name: Commit updated cards
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update analytics cards"
          file_pattern: profile/*.svg README.md
