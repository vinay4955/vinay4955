name: Generate Analytics Cards

# Renders every card in the README's GitHub Analytics section to committed SVGs
# under profile/:  streak.svg, streak-light.svg, activity-graph.svg,
# activity-graph-light.svg. All four come from scripts/generate_cards.py, which
# reads GitHub's own GraphQL contribution calendar.
#
# WHY THERE IS NO THIRD-PARTY SERVICE HERE - read before "simplifying" this.
# The activity graph used to be downloaded, pre-rendered, from
# github-readme-activity-graph.vercel.app. On 2026-08-24 that deployment began
# answering 402 DEPLOYMENT_DISABLED - the maintainer's hobby Vercel project was
# switched off. The old job caught the failed download and kept the previous
# file, so it reported success every night while serving a graph frozen for 13
# days. The streak card was generated locally and kept updating, which is why
# only half the section went stale and nobody noticed.
# Two rules came out of that, and both are load-bearing:
#   1. Nothing here may depend on a service someone else has to keep paying for.
#   2. Nothing here may fail quietly. If the data cannot be fetched the job goes
#      red. A stale card that still looks fine is the failure we are avoiding.
#
# SCHEDULING - read before touching the cron lines.
# GitHub cron is UTC-only and best-effort: a single daily cron is not reliable
# (through Aug 2026 this workflow's one cron ran 40min-3h14m late every time,
# then was dropped outright). Round minutes (:00 :15 :30 :45) are the most
# contended. So we fire several odd-minute slots and let the gate decide which
# one works. The target window is 01:00-02:59 Europe/Berlin, year round:
#   UTC 23 -> Berlin 01 (CEST) / 00 (CET)
#   UTC 00 -> Berlin 02 (CEST) / 01 (CET)
#   UTC 01 -> Berlin 03 (CEST) / 02 (CET)
# The gate accepts only Berlin hours 01 and 02, so each season gets two live
# hours and DST needs no maintenance.
on:
  schedule:
    - cron: "3,11,23,37,53 23 * * *"
    - cron: "3,11,23,37,53 0 * * *"
    - cron: "3,11,23,37,53 1 * * *"
    # Rescue sweep. These only act if the cards are already MORE than a day
    # stale, i.e. every slot in the night window was dropped. Normal days never
    # reach them. Without this a lost night silently becomes a lost week.
    - cron: "17 9,15,21 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: analytics-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The gate reads when profile/ last changed, so it needs real history.
          fetch-depth: 0

      - name: Decide whether this run should do the work
        id: gate
        env:
          TZ: Europe/Berlin
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT trigger - running unconditionally"
            exit 0
          fi

          now="$(date '+%Y-%m-%d %H:%M %Z')"
          today="$(date +%F)"
          yesterday="$(date -d 'yesterday' +%F)"
          hour="$(date +%H)"
          last="$(git log -1 --format=%cd --date=format-local:%F -- profile/ || true)"

          if [ "$last" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::already updated today ($today) - skipping"
            exit 0
          fi

          # Rescue path: more than a day behind means the whole night window was
          # dropped. Refresh now rather than wait and let the gap grow.
          if [ -n "$last" ] && [ "$last" \< "$yesterday" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::cards last updated $last - overdue, running at $now"
            exit 0
          fi

          # Normal path: only inside the 01:00-02:59 Berlin window.
          if [ "$hour" = "01" ] || [ "$hour" = "02" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$now is in the 01:00-03:00 window - running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$now is outside the 01:00-03:00 window - holding"
          fi

      - name: Render the cards
        if: steps.gate.outputs.run == 'true'
        env:
          # Berlin, like every other step. One clock for the whole job.
          # Two reasons this must not be UTC. First, during CEST the 01:xx Berlin
          # slot runs at 23:xx UTC the PREVIOUS day, so a UTC-dated card would
          # plot only through yesterday and stay that way all day - the exact lag
          # this rewrite exists to remove. Second, a UTC clock puts the run
          # window on top of the UTC midnight rollover (there is a :53 slot in
          # hour 23), so render and verify could straddle it and disagree. Berlin
          # time puts 01:00-02:59 in the middle of its own day, nowhere near a
          # boundary. GitHub accepts a `to` past the current UTC instant and
          # returns the day with a zero count, so asking for Berlin-today is safe.
          TZ: Europe/Berlin
          # STREAK_TOKEN (a PAT with `repo`) makes private contributions count.
          # Falls back to the job token, which sees public activity only.
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_cards.py

      - name: Verify the cards are actually current
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: Europe/Berlin    # must match the render step - see the note above
        run: |
          set -euo pipefail
          # The graph's aria-label ends on the last day plotted. If that is not
          # today, something rendered stale data and must not be committed.
          today="$(date +%F)"
          for f in profile/activity-graph.svg profile/activity-graph-light.svg; do
            grep -q "and $today" "$f" \
              || { echo "::error::$f does not plot through $today"; exit 1; }
          done
          for f in profile/streak.svg profile/streak-light.svg \
                   profile/activity-graph.svg profile/activity-graph-light.svg; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
            grep -q "</svg>" "$f" || { echo "::error::$f is truncated"; exit 1; }
          done
          echo "all four cards verified current through $today"

      # Do NOT give this step STREAK_TOKEN or any other PAT. It pushes to main,
      # and this workflow also triggers `on: push` to main. That is not a loop
      # only because pushes made with the default GITHUB_TOKEN do not trigger
      # further workflow runs. A PAT is treated as a real user push and would
      # start an endless push -> run -> commit -> push cycle.
      - name: Commit updated cards
        if: steps.gate.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update analytics cards"
          file_pattern: profile/*.svg
