name: Generate Streak Stats

# Renders all four README analytics cards (streak.svg, streak-light.svg,
# activity-graph.svg, activity-graph-light.svg) from GitHub's own GraphQL
# contribution calendar - no third-party service that can go down or start
# charging, and no fallback that keeps a stale card. If data cannot be fetched
# the job goes red.
#
# WHERE THE CARDS LIVE - nothing is committed to main.
# The cards are published to the `analytics` branch as a single commit by
# github-actions[bot], replaced on every run (keep_history: false). Commits on
# a non-default branch never reach the Contributors sidebar or anyone's
# contribution graph, so main carries only the owner's own work. The README
# loads the cards from raw.githubusercontent.com/.../analytics/.
#
# SCHEDULE - twice a day, 1 AM and 1 PM IST (plus once on any push that
# changes the cards).
# GitHub cron is UTC-only and best-effort: runs start late and are sometimes
# dropped with no error and no failed run. :00 and :30 are the most contended
# minutes. On 2026-09-25 the lone "30 7" (1 PM IST) cron never started, and the
# lone "30 19" one started 3h late. So each target gets seven odd-minute
# attempts across ~4h, and scripts/slot.py lets the first one that lands do the
# work while the retries behind it no-op. IST has no DST, so these never need
# adjusting. 1 AM IST = 19:30 UTC, 1 PM IST = 07:30 UTC.
on:
  schedule:
    - cron: "37 7,19 * * *"
    - cron: "11,47 8,20 * * *"
    - cron: "23,53 9,21 * * *"
    - cron: "29 10,22 * * *"
    - cron: "13 11,23 * * *"
  # A change to the cards themselves republishes at once rather than waiting
  # for the next window. No loop: this job never pushes to main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/streak.yml'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # keepalive step below

# Two retries landing together must not both publish the same slot.
concurrency:
  group: analytics-cards
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch the last published cards
        run: |
          set -euo pipefail
          last="$RUNNER_TEMP/last-streak.svg"
          # Only a branch that genuinely does not exist (ls-remote exit 2) is
          # the first-run case. Any other failure must fail the job: treating a
          # network blip as "no branch" would empty the gate's input and
          # republish a slot that is already done.
          set +e
          git ls-remote --exit-code --heads origin analytics > /dev/null
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::notice::no analytics branch yet - first publish"
            : > "$last"
          elif [ "$status" -ne 0 ]; then
            echo "::error::could not query the analytics branch (exit $status)"
            exit 1
          else
            git fetch --depth=1 origin +refs/heads/analytics:refs/remotes/origin/analytics
            git show origin/analytics:streak.svg > "$last"
          fi

      - name: Decide whether this slot still needs a run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CARD_FILE: ${{ runner.temp }}/last-streak.svg
        run: python3 scripts/slot.py

      - name: Render the cards
        if: steps.gate.outputs.run == 'true'
        env:
          # Berlin is the display clock (card date, last day plotted); the
          # streak itself is reasoned in UTC inside generate_cards.py. Keep
          # both - collapsing them zeroed a live streak on 2026-09-12.
          TZ: Europe/Berlin
          CARD_OUT: dist
          CARD_SLOT: ${{ steps.gate.outputs.slot }}
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the display day once so render and verify cannot straddle
          # Berlin midnight and disagree about a card that is fine.
          day="$(date +%F)"
          echo "CARD_DAY=$day" >> "$GITHUB_ENV"
          CARD_DAY="$day" python3 scripts/generate_cards.py

      - name: Verify the cards are current
        if: steps.gate.outputs.run == 'true'
        env:
          CARD_OUT: dist
          CARD_SLOT: ${{ steps.gate.outputs.slot }}
        run: bash scripts/verify_cards.sh

      - name: Publish the cards
        if: steps.gate.outputs.run == 'true'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: analytics
          build_dir: dist
          keep_history: false
          jekyll: false
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "cards for ${{ steps.gate.outputs.slot }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows in a public repo after 60 days
      # with no activity, and nothing here commits to main any more. Enabling
      # an enabled workflow is a no-op that resets that clock - no commit.
      # Runs even when the gate held or a step above failed; if it fails
      # itself the job goes red, so it cannot lapse silently.
      - name: Keep the schedules alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/streak.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/snake.yml/enable"
